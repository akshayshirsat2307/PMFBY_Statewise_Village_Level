name: PMFBY Weekly Scrape to Downloads Folder

on:
  schedule:
    - cron: '0 9 * * 1'   # Every Monday at 09:00 UTC
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install browser and Python dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y chromium chromium-driver
          sudo ln -sf /usr/bin/chromium /usr/bin/google-chrome
          python -m pip install --upgrade pip
          python -m pip install beautifulsoup4 selenium

      - name: Create downloads folder
        run: mkdir -p downloads

      - name: Run PMFBY scraper
        run: |
          python pmfby_scraper_dashboard.py \
            --year 2026 \
            --season Kharif \
            --scheme BOTH \
            --drill-to-district \
            --output downloads/all_states.csv

      - name: Upload CSV artifact
        uses: actions/upload-artifact@v4
        with:
          name: pmfby-downloads-csv
          path: downloads/all_states.csv
          if-no-files-found: error
