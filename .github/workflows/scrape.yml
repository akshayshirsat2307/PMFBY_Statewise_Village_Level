name: PMFBY Dahsboard Data Download

permissions:
  contents: write

on:
  schedule:
    - cron: "30 4 * * *"
  workflow_dispatch:

jobs:
  download:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install System Packages
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            chromium \
            chromium-driver \
            ghostscript \
            python3-tk \
            libgl1

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Verify browser is usable
        env:
          CHROME_BIN: /usr/bin/chromium
        run: |
          python - <<'PY'
          import os
          from selenium import webdriver
          from selenium.webdriver.chrome.options import Options
          from selenium.webdriver.chrome.service import Service

          chrome_bin = os.environ.get("CHROME_BIN") or "/usr/bin/chromium"
          if not os.path.exists(chrome_bin):
              raise SystemExit(f"Chrome binary not found: {chrome_bin}")

          opts = Options()
          opts.binary_location = chrome_bin
          opts.add_argument("--headless=new")
          opts.add_argument("--no-sandbox")
          opts.add_argument("--disable-dev-shm-usage")
          opts.add_argument("--disable-gpu")
          opts.add_argument("--window-size=1400,1000")

          driver = webdriver.Chrome(service=Service("/usr/bin/chromedriver"), options=opts)
          print("Browser startup check passed.")
          driver.quit()
          PY

      - name: Run Download Dashboard Data
        env:
          CHROME_BIN: /usr/bin/chromium
        run: |
          set -e
          mkdir -p downloads

          ATTEMPTS=3
          for i in $(seq 1 $ATTEMPTS); do
            echo "Scrape attempt $i/$ATTEMPTS"
            if python pmfby_scraper_dashboard.py \
              --year 2026 \
              --season Kharif \
              --scheme PMFBY \
              --drill-to-district \
              --output downloads/all_states.csv; then
              echo "Scrape succeeded"
              exit 0
            fi
            echo "Scrape failed on attempt $i; retrying..."
            sleep 15
          done

          echo "Scrape failed after $ATTEMPTS attempts"
          exit 1

      - name: Ensure correct branch
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git fetch origin
          git checkout "${GITHUB_REF_NAME:-main}"

      - name: Commit Downloaded Files
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if [ ! -d downloads ] || [ -z "$(find downloads -type f 2>/dev/null)" ]; then
            echo "No CSV files were generated in downloads/"
            exit 0
          fi

          git add downloads/

          if git diff --cached --quiet; then
            echo "No new files to commit."
            exit 0
          fi

          git commit -m "Daily PMFBY Update $(date +'%Y-%m-%d')"

          git push origin HEAD:"${GITHUB_REF_NAME:-main}"

      - name: Upload Downloads
        uses: actions/upload-artifact@v4
        with:
          name: PMFBY Dashboard Data
          path: downloads/
          retention-days: 30
