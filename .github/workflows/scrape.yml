name: PMFBY Scrape

permissions:
  contents: write
  
on:
  
  schedule:
    - cron: "0 2 * * 0"  # Every Sunday at 02:00 UTC
  workflow_dispatch: 
  
jobs:
  pmfby_dashboard_scrape:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system dependencies (Chrome)
        run: |
          sudo apt-get update
          sudo apt-get install -y google-chrome-stable || true

      - name: Install Python dependencies
        run: |
          pip install -r requirements.txt

      - name: Show Repository Files
        run: |
          pwd
          ls -R
          
      - name: Ensure download_dashboard directory exists
        run: |
          mkdir -p download_dashboard

      - name: Run scraper (Attempt 1)
        id: scrape_attempt_1
        continue-on-error: true
        run: |
          python pmfby_scraper_dashboard.py \
            --year 2026 --season Kharif --scheme PMFBY --state "ANDHRA PRADESH"

      - name: Run scraper (Attempt 2)
        id: scrape_attempt_2
        if: steps.scrape_attempt_1.outcome == 'failure'
        continue-on-error: true
        run: |
          echo "First attempt failed, retrying..."
          sleep 30
          python pmfby_scraper_dashboard.py \
            --year 2026 --season Kharif --scheme PMFBY --state "ANDHRA PRADESH"

      - name: Run scraper (Attempt 3)
        id: scrape_attempt_3
        if: steps.scrape_attempt_2.outcome == 'failure'
        continue-on-error: true
        run: |
          echo "Second attempt failed, retrying..."
          sleep 60
          python pmfby_scraper_dashboard.py \
            --year 2026 --season Kharif --scheme PMFBY --state "ANDHRA PRADESH"

      - name: Check if scrape succeeded
        run: |
          if [ "${{ steps.scrape_attempt_1.outcome }}" == "success" ] || \
             [ "${{ steps.scrape_attempt_2.outcome }}" == "success" ] || \
             [ "${{ steps.scrape_attempt_3.outcome }}" == "success" ]; then
            echo "Scrape succeeded in one of the attempts"
            exit 0
          else
            echo "All scrape attempts failed"
            exit 1
          fi
        
      - name: Commit Downloaded Files
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add downloads/

          if git diff --cached --quiet; then
            echo "No new files to commit."
            exit 0
          fi

          git commit -m "Daily IMD Update $(date +'%Y-%m-%d')"
          git push

      - name: Show Downloaded Files
        run: |
          echo "Files available in download_dashboard folder:"
          ls -lh download_dashboard/
          
      - name: Upload CSV files as artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pmfby-scraped-data
          path: download_dashboard/
          retention-days: 30

      - name: Check for new/modified CSV files
        id: check_files
        run: |
          if [ -n "$(git status --porcelain download_dashboard/)" ]; then
            echo "has_changes=true" >> $GITHUB_OUTPUT
          else
            echo "has_changes=false" >> $GITHUB_OUTPUT
          fi

      - name: Commit and push CSV files
        if: steps.check_files.outputs.has_changes == 'true'
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add download_dashboard/
          git commit -m "pmfby_district_data_28Sept26"
          git push

      - name: Display scrape summary
        if: always()
        run: |
          echo "=== Scrape Summary ==="
          if [ -d "download_dashboard" ]; then
            echo "CSV files generated:"
            ls -lh download_dashboard/ || echo "No files found"
          else
            echo "download_dashboard folder not found"
          fi

      - name: Send failure notification
        if: failure()
        run: |
          echo "::error::PMFBY scraper failed after 3 attempts"
