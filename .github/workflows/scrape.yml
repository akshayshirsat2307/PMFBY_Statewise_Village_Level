name: Weekly PMFBY Scrape and Commit Timestamped CSV

on:
  schedule:
    - cron: '0 9 * * 1'   # Every Monday at 09:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape-and-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install browser and Python dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y chromium chromium-driver
          sudo ln -sf /usr/bin/chromium /usr/bin/google-chrome
          python -m pip install --upgrade pip
          python -m pip install beautifulsoup4 selenium

      - name: Generate timestamp
        id: date
        run: echo "ts=$(date -u +%Y_%m_%d)" >> "$GITHUB_OUTPUT"

      - name: Run PMFBY scraper
        run: |
          python pmfby_scraper_dashboard.py \
            --year 2026 \
            --season Kharif \
            --scheme BOTH \
            --drill-to-district \
            --output "all_states_${{ steps.date.outputs.ts }}.csv"

      - name: Commit CSV to repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          FILE_NAME="all_states_${{ steps.date.outputs.ts }}.csv"
          git add "$FILE_NAME"

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Add PMFBY data for ${{ steps.date.outputs.ts }}"
            git push
          fi
