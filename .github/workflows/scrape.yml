name: PMFBY Scrape

on:
  workflow_dispatch: {}
  # or schedule:
  # schedule:
  #   - cron: "0 2 * * *"  # 02:00 UTC

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system dependencies (Chrome)
        run: |
          sudo apt-get update
          sudo apt-get install -y google-chrome-stable || true

      - name: Install Python dependencies
        run: |
          pip install -r requirements.txt

      - name: Run scraper
        run: |
          python PMFBY_Dashboard_State_Data_Download_v2.py \
            --year 2025 --season Kharif --scheme PMFBY --drill-to-district
